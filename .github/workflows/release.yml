name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: 'v0.1.0'
        type: string
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FEATURES: outbound-net

jobs:
  # ── 1. 交叉编译 reflex ────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:   aarch64-unknown-linux-musl
            os:       ubuntu-latest
            artifact: reflex-linux-aarch64
            cross:    true
          - target:   x86_64-unknown-linux-musl
            os:       ubuntu-latest
            artifact: reflex-linux-x86_64
            cross:    true
          - target:   x86_64-pc-windows-msvc
            os:       windows-latest
            artifact: reflex-windows-x86_64
            cross:    false
          - target:   aarch64-apple-darwin
            os:       macos-latest
            artifact: reflex-macos-aarch64
            cross:    false
          - target:   aarch64-linux-android
            os:       ubuntu-latest
            artifact: reflex-android-arm64-v8a
            cross:    false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install musl-tools (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked

      - name: Workaround NDK r23+ missing libgcc
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          find "${NDK_HOME}" -name "libunwind.a" -print | while read -r f; do
            dir=$(dirname "$f")
            echo "INPUT(-lunwind)" > "${dir}/libgcc.a"
            echo "Patched: ${dir}/libgcc.a"
          done

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Update Cargo.lock to match new version
        shell: bash
        run: cargo update --workspace

      - name: Build reflex (Linux x86_64, native musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Build reflex (Linux aarch64, cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net

      - name: Build reflex (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --no-default-features \
            --features outbound-net

      - name: Build reflex (macOS aarch64, native)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net

      - name: Build reflex (Android arm64-v8a, NDK)
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 24 \
            build \
            --release \
            --locked \
            --bin reflex \
            --features outbound-net

      # ── 收集产物（Linux：直接二进制；Windows：.exe） ────────────────────
      - name: Collect binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          cp "$BIN" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}"
          cat    "${{ matrix.artifact }}.sha256"

      - name: Collect binary (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          cp "$BIN" "${{ matrix.artifact }}"
          # macOS 自带 shasum 而非 sha256sum
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}"
          cat    "${{ matrix.artifact }}.sha256"

      - name: Collect binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/reflex.exe"
          cp "$BIN" "${{ matrix.artifact }}.exe"
          certutil -hashfile "${{ matrix.artifact }}.exe" SHA256 \
            | grep -v "hash" | grep -v "CertUtil" \
            > "${{ matrix.artifact }}.exe.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}.exe"
          cat    "${{ matrix.artifact }}.exe.sha256"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.exe.sha256
          retention-days: 1

  # ── 2. 创建 GitHub Release ───────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Package source code (stable branch)
        run: |
          zip -r source_code.zip . -x '.git/*' -x 'artifacts/*'
          sha256sum source_code.zip > source_code.zip.sha256
          ls -lh source_code.zip

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.event.inputs.version }}
          name:       "reflex ${{ github.event.inputs.version }}"
          prerelease: false
          draft:      false
          files: |
            artifacts/reflex-linux-aarch64/reflex-linux-aarch64
            artifacts/reflex-linux-x86_64/reflex-linux-x86_64
            artifacts/reflex-windows-x86_64/reflex-windows-x86_64.exe
            artifacts/reflex-macos-aarch64/reflex-macos-aarch64
            artifacts/reflex-android-arm64-v8a/reflex-android-arm64-v8a
            source_code.zip
