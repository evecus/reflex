name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: 'v0.1.0'
        type: string
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FEATURES: outbound-net

jobs:
  # ── 1. 交叉编译 reflex ────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:   aarch64-unknown-linux-musl
            os:       ubuntu-latest
            artifact: reflex-linux-aarch64
            cross:    true
          - target:   x86_64-unknown-linux-musl
            os:       ubuntu-latest
            artifact: reflex-linux-x86_64
            cross:    true
          - target:   x86_64-pc-windows-msvc
            os:       windows-latest
            artifact: reflex-windows-x86_64
            cross:    false
          - target:   aarch64-apple-darwin
            os:       macos-latest
            artifact: reflex-macos-aarch64
            cross:    false
          # Android arm64：官方 Rust target aarch64-linux-android，用 Android NDK
          # 自带的 clang 工具链链接 bionic libc，产物按 arm64-v8a ABI 命名，可
          # 直接放进 APK 的 jniLibs/arm64-v8a/ 目录（Android 原生识别的标准方式，
          # 与放 musl 静态二进制去 exec 调起是两条不同路线，不能混用）。
          - target:   aarch64-linux-android
            os:       ubuntu-latest
            artifact: reflex-android-arm64-v8a
            cross:    false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install musl-tools (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          # macOS 自带 BSD sed，-i 必须显式带备份后缀参数（即使是空字符串），
          # 而 Linux/Windows(bash) 用的 GNU sed 则不需要，两者语法不兼容。
          # 用 -i.bak + 删除备份文件的写法在两个 sed 实现下都能正确工作。
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Update Cargo.lock to match new version
        shell: bash
        run: cargo update --workspace

      - name: Build reflex (Linux x86_64, native musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Build reflex (Linux aarch64, cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net

      - name: Build reflex (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --no-default-features \
            --features outbound-net

      - name: Build reflex (macOS aarch64, native)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net

      - name: Build reflex (Android arm64-v8a, NDK)
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 24 \
            -o target-ndk-out \
            build \
            --release \
            --locked \
            --bin reflex \
            --features outbound-net

      # ── 收集产物（Linux：直接二进制；Windows：.exe） ────────────────────
      - name: Collect binary (Linux)
        if: runner.os == 'Linux' && matrix.target != 'aarch64-linux-android'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          cp "$BIN" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}"
          cat    "${{ matrix.artifact }}.sha256"

      - name: Collect binary (Android)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          # cargo-ndk 用 -o target-ndk-out 时按 ABI 名分子目录输出，
          # 与普通 cargo build --target 的 target/<triple>/release/ 路径不同
          BIN="target-ndk-out/arm64-v8a/reflex"
          cp "$BIN" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}"
          cat    "${{ matrix.artifact }}.sha256"

      - name: Collect binary (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          cp "$BIN" "${{ matrix.artifact }}"
          # macOS 自带 shasum 而非 sha256sum
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}"
          cat    "${{ matrix.artifact }}.sha256"

      - name: Collect binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/reflex.exe"
          cp "$BIN" "${{ matrix.artifact }}.exe"
          certutil -hashfile "${{ matrix.artifact }}.exe" SHA256 \
            | grep -v "hash" | grep -v "CertUtil" \
            > "${{ matrix.artifact }}.exe.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}.exe"
          cat    "${{ matrix.artifact }}.exe.sha256"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.exe.sha256
          retention-days: 1

  # ── 2. 创建 GitHub Release ───────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Merge checksums
        run: |
          cat artifacts/**/*.sha256 > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt
          cp config.example.json artifacts/config.json

      - name: Create and push tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.event.inputs.version }}
          name:       "reflex ${{ github.event.inputs.version }}"
          prerelease: false
          draft:      false
          files: |
            artifacts/reflex-linux-aarch64/reflex-linux-aarch64
            artifacts/reflex-linux-x86_64/reflex-linux-x86_64
            artifacts/reflex-windows-x86_64/reflex-windows-x86_64.exe
            artifacts/reflex-macos-aarch64/reflex-macos-aarch64
            artifacts/reflex-android-arm64-v8a/reflex-android-arm64-v8a
            artifacts/config.json
