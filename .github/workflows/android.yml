name: Build Android arm64 (musl static binary)

on:
  workflow_dispatch:

env:
  BIN_NAME: reflex
  TARGET: aarch64-unknown-linux-musl

jobs:
  build:
    name: Build ${{ github.event.repository.name }} (${{ env.TARGET }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build release binary (static musl)
        run: |
          cross build --release \
            --target ${{ env.TARGET }} \
            --bin ${{ env.BIN_NAME }} \
            --features outbound-net
        env:
          RUST_BACKTRACE: "0"

      - name: Verify static linking
        run: |
          BIN=target/${{ env.TARGET }}/release/${{ env.BIN_NAME }}
          file "$BIN"
          # musl 静态二进制不应有动态解释器；ldd 输出非 "not a dynamic executable" 则判失败
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable"; then
            echo "::error::二进制不是静态链接的，请检查 target 是否为 musl 且未意外引入动态依赖"
            ldd "$BIN" || true
            exit 1
          fi
          echo "OK: 静态链接确认通过"

      - name: Strip & package
        run: |
          mkdir -p dist
          cp target/${{ env.TARGET }}/release/${{ env.BIN_NAME }} dist/${{ env.BIN_NAME }}-android-arm64
          chmod +x dist/${{ env.BIN_NAME }}-android-arm64
          cd dist && sha256sum ${{ env.BIN_NAME }}-android-arm64 > ${{ env.BIN_NAME }}-android-arm64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: reflex test
          files: |
            dist/${{ env.BIN_NAME }}-android-arm64
          generate_release_notes: true
