name: Build Android arm64 (musl static binary)

# 目标：产出一个可在 Android arm64-v8a 设备上直接运行的静态链接二进制。
# 做法：交叉编译到 aarch64-unknown-linux-musl（而不是 aarch64-linux-android），
# 因为 musl 静态链接产物不依赖系统 libc 版本，可以绕开各厂商 bionic 版本差异，
# 这是 Android 端 VPN/代理内核类二进制常见的发布方式（随 APK 打包，或由前端
# App 释放到私有目录后 exec 调起）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "是否创建 GitHub Release 并上传产物"
        type: boolean
        default: false

env:
  BIN_NAME: reflex
  TARGET: aarch64-unknown-linux-musl

jobs:
  build:
    name: Build ${{ github.event.repository.name }} (${{ env.TARGET }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      # 用 cross 而非原生 cargo 直接指定 musl target：
      # 项目 outbound-net feature 拉入 ring（含少量 asm/C 代码）、tun 等带 C
      # 编译产物的 crate，本机手工配 musl-gcc 交叉工具链容易踩坑；cross 提供
      # 预置好完整交叉工具链的容器，稳定性更好，也是 Rust 生态交叉编译的标准做法。
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build release binary (static musl)
        run: |
          cross build --release \
            --target ${{ env.TARGET }} \
            --bin ${{ env.BIN_NAME }} \
            --features outbound-net
        env:
          RUST_BACKTRACE: "0"

      - name: Verify static linking
        run: |
          BIN=target/${{ env.TARGET }}/release/${{ env.BIN_NAME }}
          file "$BIN"
          # musl 静态二进制不应有动态解释器；ldd 输出非 "not a dynamic executable" 则判失败
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable"; then
            echo "::error::二进制不是静态链接的，请检查 target 是否为 musl 且未意外引入动态依赖"
            ldd "$BIN" || true
            exit 1
          fi
          echo "OK: 静态链接确认通过"

      - name: Strip & package
        run: |
          mkdir -p dist
          cp target/${{ env.TARGET }}/release/${{ env.BIN_NAME }} dist/${{ env.BIN_NAME }}-android-arm64
          chmod +x dist/${{ env.BIN_NAME }}-android-arm64
          cd dist && sha256sum ${{ env.BIN_NAME }}-android-arm64 > ${{ env.BIN_NAME }}-android-arm64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-android-arm64-musl
          path: |
            dist/${{ env.BIN_NAME }}-android-arm64
            dist/${{ env.BIN_NAME }}-android-arm64.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.BIN_NAME }}-android-arm64
            dist/${{ env.BIN_NAME }}-android-arm64.sha256
          generate_release_notes: true
