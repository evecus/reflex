name: Build Dashboard
on:
  workflow_dispatch:
permissions:
  contents: write   # tag 推送时创建 release 需要

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Pack artifact
        run: |
          # 把 dist/ 打包成 zip，便于用户直接解压到 reflex external_ui 目录
          cd dist
          zip -r ../reflex-dashboard.zip .
          cd ..
          # 生成 sha256
          sha256sum reflex-dashboard.zip > reflex-dashboard.zip.sha256
          echo "=== Build output ==="
          ls -lh dist/
          echo "=== Artifact ==="
          ls -lh reflex-dashboard.zip
          cat reflex-dashboard.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-test
          name: "Reflex Dashboard test"
          generate_release_notes: true
          files: |
            reflex-dashboard.zip
