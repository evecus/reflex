name: ui
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：test（固定 tag=test）还是 release（正式发布，需填写版本号）"
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release
      version:
        description: "Release version（仅 mode=release 时生效，例如 v1.0.0）"
        required: false
        default: 'v0.1.0'
        type: string
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Pack artifact
        run: |
          # 把 dist/ 打包成 zip，便于用户直接解压到 reflex external_ui 目录
          cd dist
          zip -r ../reflex-dashboard.zip .
          cd ..
          # 生成 sha256
          sha256sum reflex-dashboard.zip > reflex-dashboard.zip.sha256
          echo "=== Build output ==="
          ls -lh dist/
          echo "=== Artifact ==="
          ls -lh reflex-dashboard.zip
          cat reflex-dashboard.zip.sha256

      - name: Create GitHub Release (test)
        if: github.event.inputs.mode == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   test
          name:       "reflex test"
          generate_release_notes: true
          files: |
            reflex-dashboard.zip

      - name: Create GitHub Release (release)
        if: github.event.inputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.event.inputs.version }}
          name:       "reflex ${{ github.event.inputs.version }}"
          generate_release_notes: true
          files: |
            reflex-dashboard.zip
