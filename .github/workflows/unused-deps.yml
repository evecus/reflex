name: Check unused dependencies

on:
  workflow_dispatch:

jobs:
  udeps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      # reflex 用了大量 optional feature（outbound-net 等），
      # 必须开 --all-features 才能把所有可选依赖也纳入检测，
      # 否则被 feature gate 掉的依赖会被误判为“未使用”。
      - name: Run cargo-udeps (all features)
        run: cargo +nightly udeps --all-targets --all-features
        continue-on-error: true
        id: udeps_all

      # 额外跑一遍默认 feature（只有 jemalloc），
      # 对照结果更接近日常构建时的真实情况
      - name: Run cargo-udeps (default features)
        run: cargo +nightly udeps --all-targets
        continue-on-error: true
        id: udeps_default

      - name: Fail if any run reported unused deps
        if: steps.udeps_all.outcome == 'failure' || steps.udeps_default.outcome == 'failure'
        run: |
          echo "cargo-udeps 检测到未使用的依赖，请查看上方日志输出。"
          exit 1
