name: Release (32-bit)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: 'v0.1.0'
        type: string
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FEATURES: outbound-net

jobs:
  # ── 1. 交叉编译 reflex（全部 32 位目标） ─────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:   i686-unknown-linux-musl
            os:       ubuntu-latest
            artifact: reflex-linux-i686
            cross:    true
          - target:   armv7-unknown-linux-musleabihf
            os:       ubuntu-latest
            artifact: reflex-linux-armv7
            cross:    true
          - target:   i686-pc-windows-msvc
            os:       windows-latest
            artifact: reflex-windows-i686
            cross:    false
          - target:   armv7-linux-androideabi
            os:       ubuntu-latest
            artifact: reflex-android-armv7
            cross:    false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (i686 / armv7 musl)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Android NDK
        if: matrix.target == 'armv7-linux-androideabi'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        if: matrix.target == 'armv7-linux-androideabi'
        run: cargo install cargo-ndk --locked

      - name: Workaround NDK r23+ missing libgcc
        if: matrix.target == 'armv7-linux-androideabi'
        shell: bash
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          find "${NDK_HOME}" -name "libunwind.a" -print | while read -r f; do
            dir=$(dirname "$f")
            echo "INPUT(-lunwind)" > "${dir}/libgcc.a"
            echo "Patched: ${dir}/libgcc.a"
          done

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Update Cargo.lock to match new version
        shell: bash
        run: cargo update --workspace

      - name: Build reflex (Linux i686, cross)
        if: matrix.target == 'i686-unknown-linux-musl'
        run: |
          cross build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net

      - name: Build reflex (Linux armv7 musleabihf, cross)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          cross build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --features outbound-net

      - name: Build reflex (Windows i686)
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.target }} \
            --bin reflex \
            --no-default-features \
            --features outbound-net

      - name: Build reflex (Android armv7, NDK)
        if: matrix.target == 'armv7-linux-androideabi'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target armv7-linux-androideabi \
            --platform 24 \
            build \
            --release \
            --locked \
            --bin reflex \
            --features outbound-net

      # ── 收集产物（Linux：直接二进制；Windows：.exe） ────────────────────
      - name: Collect binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="target/${{ matrix.target }}/release/reflex"
          cp "$BIN" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}"
          cat    "${{ matrix.artifact }}.sha256"

      - name: Collect binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/reflex.exe"
          cp "$BIN" "${{ matrix.artifact }}.exe"
          certutil -hashfile "${{ matrix.artifact }}.exe" SHA256 \
            | grep -v "hash" | grep -v "CertUtil" \
            > "${{ matrix.artifact }}.exe.sha256"
          echo "=== Build output ==="
          ls -lh "${{ matrix.artifact }}.exe"
          cat    "${{ matrix.artifact }}.exe.sha256"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.exe.sha256
          retention-days: 1

  # ── 2. 交叉编译 reflex（mipsel softfloat，nightly + build-std） ──────────
  build-mipsle:
    name: Build / mipsel-unknown-linux-musl (softfloat)
    runs-on: ubuntu-latest

    env:
      TARGET: mipsel-unknown-linux-musl
      ARTIFACT: reflex-linux-mipsle-softfloat
      TOOLCHAIN_NAME: mipsel-unknown-linux-muslsf
      TOOLCHAIN_PREFIX: mipsel-linux-muslsf

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      # 固定 nightly 到具体日期，而非滚动的 nightly 最新版：
      # 2026-07-23/24 附近的 nightly 在编译 tokio（mipsel softfloat + -Z build-std
      # 这种冷门 target-feature 组合）时会在 codegen 阶段触发 rustc 内部错误
      # (ICE, "not immediate: OperandRef(...Notified<Arc<...Handle>>...)")，
      # 这是 rustc 自身在该组合下的 bug，不是本 workflow 的配置问题。
      # 若这个日期仍然复现 ICE，替换成更早的日期重试；若已确认某个日期稳定，
      # 把下面两处（build-mipsle 和 build-mips 两个 job）的 toolchain 值都同步改掉。
      - name: Install Rust nightly + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-mipsle-softfloat-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mipsle-softfloat-cargo-

      - name: Install mipsel-linux-muslsf toolchain
        run: |
          RELEASE_URL="https://github.com/cross-tools/musl-cross/releases/latest/download/${TOOLCHAIN_NAME}.tar.xz"
          curl -fsSL "$RELEASE_URL" -o toolchain.tar.xz
          tar -xJf toolchain.tar.xz -C /opt

          TOOLCHAIN_BIN=$(find /opt -type f -name "*mipsel*-gcc" 2>/dev/null \
            | grep -v '\-gcc-[0-9]' | head -1 | xargs -r dirname)
          [ -z "$TOOLCHAIN_BIN" ] && \
            TOOLCHAIN_BIN=$(find /opt -type f -name "*-gcc" 2>/dev/null | head -1 | xargs -r dirname)
          [ -z "$TOOLCHAIN_BIN" ] && { find /opt -maxdepth 5 | sort; exit 1; }

          ACTUAL_GCC=$(find "$TOOLCHAIN_BIN" -maxdepth 1 -type f -name "*-gcc" | head -1 | xargs basename)
          ACTUAL_PREFIX="${ACTUAL_GCC%-gcc}"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_PREFIX=$ACTUAL_PREFIX" >> "$GITHUB_ENV"
        env:
          TOOLCHAIN_NAME: ${{ env.TOOLCHAIN_NAME }}

      - name: Verify toolchain
        run: |
          ${TOOLCHAIN_PREFIX}-gcc --version
          echo "Machine: $(${TOOLCHAIN_PREFIX}-gcc -dumpmachine)"

      - name: Write .cargo/config.toml
        run: |
          mkdir -p .cargo
          SYSROOT=$(${TOOLCHAIN_PREFIX}-gcc --print-sysroot)
          MUSL_CRT_DIR=$(find "$SYSROOT" -name "crt1.o" 2>/dev/null | head -1 | xargs -r dirname)
          [ -z "$MUSL_CRT_DIR" ] && \
            MUSL_CRT_DIR=$(find /opt -name "crt1.o" 2>/dev/null | head -1 | xargs -r dirname)
          [ -z "$MUSL_CRT_DIR" ] && { echo "ERROR: crt1.o not found"; exit 1; }

          GCC_CRT_DIR=$(${TOOLCHAIN_PREFIX}-gcc -print-libgcc-file-name | xargs dirname)
          ls "$GCC_CRT_DIR"/crtbegin.o "$GCC_CRT_DIR"/crtend.o 2>/dev/null || \
            GCC_CRT_DIR=$(find /opt -name "crtbegin.o" 2>/dev/null | head -1 | xargs -r dirname)

          mkdir -p stub-libs
          LIBGCC_EH=$(find /opt -name "libgcc_eh.a" 2>/dev/null | head -1)
          if [ -n "$LIBGCC_EH" ]; then
            cp "$LIBGCC_EH" stub-libs/libunwind.a
          else
            ${TOOLCHAIN_PREFIX}-ar rcs stub-libs/libunwind.a
          fi
          STUB_DIR="$(pwd)/stub-libs"
          LIBGCC_A=$(${TOOLCHAIN_PREFIX}-gcc -print-libgcc-file-name)

          WRAPPER_PATH=/usr/local/bin/mipsle-musl-linker
          cat > "$WRAPPER_PATH" << WRAPPER_EOF
          #!/bin/bash
          args=()
          for a in "\$@"; do
            case "\$a" in
              crt1.o|crti.o|crtn.o) args+=("${MUSL_CRT_DIR}/\$a");;
              crtbegin.o|crtend.o)  args+=("${GCC_CRT_DIR}/\$a");;
              *) args+=("\$a");;
            esac
          done
          exec ${TOOLCHAIN_PREFIX}-gcc -B"${MUSL_CRT_DIR}" -B"${GCC_CRT_DIR}" -L"${MUSL_CRT_DIR}" -L"${GCC_CRT_DIR}" -L"${STUB_DIR}" "\${args[@]}" "${LIBGCC_A}"
          WRAPPER_EOF
          chmod +x "$WRAPPER_PATH"

          printf '[target.%s]\nlinker = "%s"\nrustflags = [\n  "-C", "target-cpu=mips32r2",\n  "-C", "target-feature=+crt-static,+mips32r2,+dsp,-fp64",\n  "-C", "panic=abort",\n]\n' \
            "${TARGET}" "${WRAPPER_PATH}" > .cargo/config.toml

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Update Cargo.lock to match new version
        run: cargo generate-lockfile

      - name: Build reflex
        run: |
          export CC_mipsel_unknown_linux_musl="${TOOLCHAIN_PREFIX}-gcc"
          export AR_mipsel_unknown_linux_musl="${TOOLCHAIN_PREFIX}-ar"
          cargo clean --target ${{ env.TARGET }} 2>/dev/null || true
          cargo build \
            --release \
            -Z build-std="std,panic_abort" \
            --target ${{ env.TARGET }} \
            --bin reflex \
            --features outbound-net

      - name: Collect binary
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/reflex" dist/reflex
          cd dist
          tar -czf "../${{ env.ARTIFACT }}.tar.gz" reflex
          cd ..
          sha256sum "${{ env.ARTIFACT }}.tar.gz" > "${{ env.ARTIFACT }}.tar.gz.sha256"
          ls -lh "${{ env.ARTIFACT }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.tar.gz
            ${{ env.ARTIFACT }}.tar.gz.sha256
          retention-days: 1

  # ── 3. 交叉编译 reflex（mips 大端，nightly + build-std） ─────────────────
  build-mips:
    name: Build / mips-unknown-linux-musl
    runs-on: ubuntu-latest

    env:
      TARGET: mips-unknown-linux-musl
      ARTIFACT: reflex-linux-mips
      TOOLCHAIN_NAME: mips-unknown-linux-muslsf
      TOOLCHAIN_PREFIX: mips-linux-muslsf

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      # 与上面 build-mipsle job 使用同一固定日期，避免两个 job 用不同
      # nightly 版本导致行为不一致；调整日期时两处需同步修改。
      - name: Install Rust nightly + rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-mips-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mips-musl-cargo-

      - name: Install mips-linux-muslsf toolchain
        run: |
          RELEASE_URL="https://github.com/cross-tools/musl-cross/releases/latest/download/${TOOLCHAIN_NAME}.tar.xz"
          curl -fsSL "$RELEASE_URL" -o toolchain.tar.xz
          tar -xJf toolchain.tar.xz -C /opt

          TOOLCHAIN_BIN=$(find /opt -type f -name "*mips*-gcc" 2>/dev/null \
            | grep -v '\-gcc-[0-9]' | head -1 | xargs -r dirname)
          [ -z "$TOOLCHAIN_BIN" ] && \
            TOOLCHAIN_BIN=$(find /opt -type f -name "*-gcc" 2>/dev/null | head -1 | xargs -r dirname)
          [ -z "$TOOLCHAIN_BIN" ] && { find /opt -maxdepth 5 | sort; exit 1; }

          ACTUAL_GCC=$(find "$TOOLCHAIN_BIN" -maxdepth 1 -type f -name "*-gcc" | head -1 | xargs basename)
          ACTUAL_PREFIX="${ACTUAL_GCC%-gcc}"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_PREFIX=$ACTUAL_PREFIX" >> "$GITHUB_ENV"
        env:
          TOOLCHAIN_NAME: ${{ env.TOOLCHAIN_NAME }}

      - name: Write .cargo/config.toml
        run: |
          mkdir -p .cargo
          SYSROOT=$(${TOOLCHAIN_PREFIX}-gcc --print-sysroot)
          MUSL_CRT_DIR=$(find "$SYSROOT" -name "crt1.o" 2>/dev/null | head -1 | xargs -r dirname)
          [ -z "$MUSL_CRT_DIR" ] && \
            MUSL_CRT_DIR=$(find /opt -name "crt1.o" 2>/dev/null | head -1 | xargs -r dirname)
          [ -z "$MUSL_CRT_DIR" ] && { echo "ERROR: crt1.o not found"; exit 1; }

          GCC_CRT_DIR=$(${TOOLCHAIN_PREFIX}-gcc -print-libgcc-file-name | xargs dirname)
          ls "$GCC_CRT_DIR"/crtbegin.o "$GCC_CRT_DIR"/crtend.o 2>/dev/null || \
            GCC_CRT_DIR=$(find /opt -name "crtbegin.o" 2>/dev/null | head -1 | xargs -r dirname)

          mkdir -p stub-libs
          LIBGCC_EH=$(find /opt -name "libgcc_eh.a" 2>/dev/null | head -1)
          if [ -n "$LIBGCC_EH" ]; then
            cp "$LIBGCC_EH" stub-libs/libunwind.a
          else
            ${TOOLCHAIN_PREFIX}-ar rcs stub-libs/libunwind.a
          fi
          STUB_DIR="$(pwd)/stub-libs"
          LIBGCC_A=$(${TOOLCHAIN_PREFIX}-gcc -print-libgcc-file-name)

          WRAPPER_PATH=/usr/local/bin/mips-musl-linker
          cat > "$WRAPPER_PATH" << WRAPPER_EOF
          #!/bin/bash
          args=()
          for a in "\$@"; do
            case "\$a" in
              crt1.o|crti.o|crtn.o) args+=("${MUSL_CRT_DIR}/\$a");;
              crtbegin.o|crtend.o)  args+=("${GCC_CRT_DIR}/\$a");;
              *) args+=("\$a");;
            esac
          done
          exec ${TOOLCHAIN_PREFIX}-gcc -B"${MUSL_CRT_DIR}" -B"${GCC_CRT_DIR}" -L"${MUSL_CRT_DIR}" -L"${GCC_CRT_DIR}" -L"${STUB_DIR}" "\${args[@]}" "${LIBGCC_A}"
          WRAPPER_EOF
          chmod +x "$WRAPPER_PATH"

          printf '[target.%s]\nlinker = "%s"\nrustflags = [\n  "-C", "target-cpu=mips32",\n  "-C", "target-feature=+crt-static",\n  "-C", "panic=abort",\n]\n' \
            "${TARGET}" "${WRAPPER_PATH}" > .cargo/config.toml

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Update Cargo.lock to match new version
        run: cargo generate-lockfile

      - name: Build reflex
        run: |
          export CC_mips_unknown_linux_musl="${TOOLCHAIN_PREFIX}-gcc"
          export AR_mips_unknown_linux_musl="${TOOLCHAIN_PREFIX}-ar"
          cargo clean --target ${{ env.TARGET }} 2>/dev/null || true
          cargo build \
            --release \
            -Z build-std="std,panic_abort" \
            --target ${{ env.TARGET }} \
            --bin reflex \
            --features outbound-net

      - name: Verify binary
        run: |
          file "target/${{ env.TARGET }}/release/reflex"
          ${TOOLCHAIN_PREFIX}-readelf -A "target/${{ env.TARGET }}/release/reflex" \
            | grep -i "abi\|float\|endian" || true

      - name: Collect binary
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/reflex" dist/reflex
          cd dist
          tar -czf "../${{ env.ARTIFACT }}.tar.gz" reflex
          cd ..
          sha256sum "${{ env.ARTIFACT }}.tar.gz" > "${{ env.ARTIFACT }}.tar.gz.sha256"
          ls -lh "${{ env.ARTIFACT }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.tar.gz
            ${{ env.ARTIFACT }}.tar.gz.sha256
          retention-days: 1

  # ── 4. 创建 GitHub Release ───────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-mipsle, build-mips]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Delete existing pre-releases and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | while read -r tag; do
                echo "Deleting pre-release and tag: $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.event.inputs.version }}
          name:       "reflex ${{ github.event.inputs.version }} (32-bit)"
          prerelease: false
          draft:      false
          files: |
            artifacts/reflex-linux-i686/reflex-linux-i686
            artifacts/reflex-linux-armv7/reflex-linux-armv7
            artifacts/reflex-windows-i686/reflex-windows-i686.exe
            artifacts/reflex-android-armv7/reflex-android-armv7
            artifacts/reflex-linux-mipsle-softfloat/reflex-linux-mipsle-softfloat.tar.gz
            artifacts/reflex-linux-mips/reflex-linux-mips.tar.gz
